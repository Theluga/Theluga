name: Update README cards

on:
  schedule:
    - cron: "0 0 * * *" # Runs once daily at midnight
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true

      - name: Generate stats card
        uses: Theluga/github-readme-stats-action@main
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&count_private=true
          path: profile/stats.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Generate top languages card
        uses: Theluga/github-readme-stats-action@main
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&include_all_commits=true
          path: profile/top-langs.svg
          token: ${{ secrets.PROFILE_STATS_TOKEN }}

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "Update README cards" || exit 0
          git push
